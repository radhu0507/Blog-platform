# Render blueprint for the BlogSpace single-service deployment.
# One web service serves both the Express API and the built React app, so there
# is a single origin and CORS is not involved in production.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: blogspace
    runtime: node
    plan: free
    region: singapore

    # Build the API and the client in the same run, so client/dist exists
    # before the server starts serving it.
    #
    # --include=dev is required. Render sets NODE_ENV=production, which makes npm
    # default to omit=dev, so a plain `npm ci` does not install typescript,
    # prisma or the @types packages and the TypeScript build fails. Dev
    # dependencies are needed to build only; at runtime the server executes the
    # compiled dist output and never loads them.
    #
    # db:generate is also required. `npm ci` does not run prisma generate for the
    # hoisted workspace client, so tsc typechecks against the stub typings and
    # fails with TS2339 for Prisma.PrismaClientKnownRequestError in
    # middleware/errorHandler.ts. Generate needs no database connection.
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    startCommand: npm run start --workspace server

    # /api/health already exists, so no extra endpoint is needed.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: "20"

      # Neon (or any host) POOLED connection string - used at runtime.
      - key: DATABASE_URL
        sync: false

      # Render generates and stores this for you. Do not put it in this file.
      - key: JWT_SECRET
        generateValue: true

      # Same-origin deployment, so no cross-origin value is needed. Set this
      # manually only if you later host the frontend separately.
      - key: CORS_ORIGIN
        sync: false